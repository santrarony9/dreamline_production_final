<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1f180d" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0e0c09" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040404" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c578"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#917234"/>
    </linearGradient>
    <linearGradient id="instaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f09433"/>
      <stop offset="25%" stop-color="#e6683c"/>
      <stop offset="50%" stop-color="#dc2743"/>
      <stop offset="75%" stop-color="#cc2366"/>
      <stop offset="100%" stop-color="#bc1888"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bgGlow)"/>

  <!-- Subtle Luxury Corner Accents -->
  <rect x="40" y="40" width="1000" height="1840" rx="36" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="60" y="60" width="960" height="1800" rx="24" fill="none" stroke="white" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Top Header: Instagram Badge -->
  <g transform="translate(540, 260)" text-anchor="middle">
    <!-- Instagram Icon Outline -->
    <rect x="-42" y="-140" width="84" height="84" rx="24" fill="none" stroke="url(#instaGrad)" stroke-width="6"/>
    <circle cx="0" cy="-98" r="20" fill="none" stroke="url(#instaGrad)" stroke-width="6"/>
    <circle cx="24" cy="-122" r="5" fill="url(#instaGrad)"/>

    <text y="0" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="900" fill="url(#goldGradient)" letter-spacing="8">INSTAGRAM REEL</text>
    <text y="42" font-family="'Montserrat', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#a0a0a0" letter-spacing="4">@SPARKBLUEDIAMOND</text>
  </g>

  <!-- Center Artwork / Play Emblem -->
  <g transform="translate(540, 960)">
    <!-- Outer Glow Rings -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-opacity="0.25"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="100" fill="#0c0c0c" stroke="url(#goldGradient)" stroke-width="4" filter="url(#glow)"/>
    
    <!-- Centered Golden Play Triangle -->
    <polygon points="-16,-34 36,0 -16,34" fill="url(#goldGradient)"/>
  </g>

  <!-- Bottom Details: Brand & Collection -->
  <g transform="translate(540, 1420)" text-anchor="middle">
    <rect x="-180" y="-80" width="360" height="42" rx="21" fill="#141414" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.4"/>
    <text y="-52" font-family="'Montserrat', sans-serif" font-size="16" font-weight="900" fill="#e5c578" letter-spacing="4">FINE CRAFTSMANSHIP</text>

    <text y="40" font-family="'Cinzel', 'Playfair Display', serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="4">SPARK BLUE DIAMOND</text>
    <text y="90" font-family="'Montserrat', sans-serif" font-size="22" font-weight="600" fill="#c5a059" letter-spacing="3">LUXURY DIAMOND AESTHETICS REEL</text>
    <text y="140" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" fill="#777777" letter-spacing="2">DREAMLINE PRODUCTION • 4K FASHION CINEMA</text>
  </g>

  <!-- Footer ID watermark -->
  <text x="540" y="1800" text-anchor="middle" font-family="monospace" font-size="16" fill="#444444" letter-spacing="2">REEL ID: DctAtC-tnP0</text>
</svg>